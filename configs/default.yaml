vad:
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 100
diarization:
  distance_threshold: 0.75
  min_segment_sec: 0.4
  num_speakers: null
  window_sec: 1.0
  hop_sec: 0.33
  min_turn_sec: 0.3
  cell_sec: 0.125
separation:
  enabled: false
  model_name: speechbrain/sepformer-whamr16k
  device: null
  min_region_sec: 0.4
  pad_sec: 0.25
  assign_min_sim: 0.35
  assign_min_margin: 0.03
asr:
  model_size: small
  device: cuda
  compute_type: float16
  language: fr
  beam_size: 1
reconstruction:
  max_gap: 30.0
  tau: 4.0
  w_temporal: 0.10
  w_semantic: 0.50
  w_same_speaker: 0.40
  threshold: 0.4
  max_speaker_overlap_ratio: 0.05
synthetic:
  sample_rate: 16000
  snr_db: 15.0
  mean_gap_sec: 0.8
  min_words: 3
  max_words: 14
graph:
  model_path: models/graph_lr.json
  max_gap: 30.0
  tau: 4.0
  edge_threshold: 0.5
  resolution: 1.0
  seed: 0
  negative_ratio: 3.0
tse:
  model_path: models/tse/model.pt
  hparams_path: models/tse/hparams.yaml
  n_fft: 512
  hop: 256
  window: hann
  n_blocks: 3
  channels: 64
  embed_dim: 192
  lr: 3e-4
  grad_clip: 1.0
  epochs: 30
  batch_size: 4
  snr_low: 10.0
  snr_high: 20.0
  noise_bandwidth: 3400.0
reconstructor_kind: heuristic
text_embedding_model: paraphrase-multilingual-MiniLM-L12-v2
